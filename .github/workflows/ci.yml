name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: macOS build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          xcode="/Applications/Xcode_16.4.app"
          if [ ! -d "$xcode" ]; then
            echo "Required Xcode is missing: $xcode" >&2
            ls /Applications | grep -i Xcode || true
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version

      - name: Build (debug)
        run: swift build -c debug

      - name: Strict concurrency
        # Swift 5 language mode. Complete checking covers every target, including Metal.
        run: |
          swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
          swift build --build-tests -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Test
        # Swift 6 runs Swift Testing by default and would exit 0 with zero XCTest cases.
        run: swift test --enable-xctest --parallel

      - name: Compile shaders
        run: bash Scripts/compile-shaders.sh

      - name: Build (release)
        run: swift build -c release

  linux-swift-5-10:
    name: Linux Swift 5.10
    runs-on: ubuntu-latest
    container: swift:5.10@sha256:ffc42e399ad0cad324f68d58f65e4d5f2c22eb9df73c4dfa249e898d497254b3
    steps:
      - uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Build the engine without Metal
        # Warnings are errors on the tools-version floor so a 5.10-only failure
        # cannot hide behind a clean Swift 6 build.
        run: swift build --target Ferox -Xswiftc -warnings-as-errors

      - name: Test platform-independent modules
        # `--enable-xctest` does not exist on Swift 5.10; XCTest is the only runner.
        run: swift test -Xswiftc -warnings-as-errors --filter "FeroxMathTests|FeroxCoreTests|FeroxSceneTests|FeroxPhysicsTests|FeroxSubsystemTests|FeroxRenderTests|FeroxIntegrationTests"

  linux-swift-6-2:
    name: Linux Swift 6.2
    runs-on: ubuntu-latest
    container: swift:6.2@sha256:d6f8f6112e9a63da0a4a151d6b93acd16699d35c0b82531ac1a245f5af210197
    steps:
      - uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Package.swift

      - name: Strict concurrency
        # Swift 5 language mode. Complete checking covers every target this job can compile.
        run: |
          swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
          swift build --build-tests -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test --enable-xctest --parallel

  docs:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check relative links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress README.md "Docs/**/*.md"
          fail: true

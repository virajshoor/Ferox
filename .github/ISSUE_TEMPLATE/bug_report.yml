name: Bug report
description: Report a reproducible problem in Ferox
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please search existing issues first.
        Do not use this form for security vulnerabilities; see SECURITY.md.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps. A small project or code snippet is ideal.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true

  - type: input
    id: ferox-version
    attributes:
      label: Ferox version
      description: Release version or commit SHA.
      placeholder: "0.1.0 or a commit SHA"
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "14.5"
    validations:
      required: true

  - type: input
    id: mac-model
    attributes:
      label: Mac model and chip
      description: For example, "MacBook Pro M3 Pro".
      placeholder: "MacBook Pro M3 Pro"
    validations:
      required: true

  - type: textarea
    id: gpu-family
    attributes:
      label: GPU family
      description: Paste the output of `FeroxDiag`.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant console or log output. Remove any personal or secret data first.
      render: shell
